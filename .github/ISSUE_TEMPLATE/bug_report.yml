name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the open issues first, in case it is already known.
        Security problems do not belong here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of steps that makes it happen.
      placeholder: |
        1. Open a new tab
        2. Run ...
        3. Press ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TerminalHub version
      description: Shown under TerminalHub > About TerminalHub. Or the commit you built from.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.1, MacBook Pro M3"
    validations:
      required: true
  - type: input
    id: program
    attributes:
      label: Program running in the terminal
      description: If the problem only shows in one program, name it.
      placeholder: "zsh, vim, ssh, claude ..."
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: A screenshot helps a lot for drawing problems. Remove anything private first.
