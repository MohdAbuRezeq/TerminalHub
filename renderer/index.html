<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TerminalHub</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    window.process = { env: {} };
  </script>
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <div id="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span>TerminalHub</span>
      </div>
      <button id="sidebar-toggle" title="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>

    <button id="new-terminal-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>New Terminal</span>
    </button>

    <div id="terminal-list"></div>

    <div id="sidebar-footer">
      <div id="terminal-stats">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span id="stats-text">0 terminals</span>
      </div>
      <div id="shortcuts-hint">
        <kbd>&#8984;T</kbd> new &middot; <kbd>&#8984;W</kbd> close &middot; <kbd>&#8984;D</kbd> split
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main id="main">
    <!-- Drag region for window -->
    <div id="main-titlebar">
      <button id="sidebar-expand" title="Show sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
      <div id="main-title"></div>
      <div id="main-actions">
        <button id="split-h-btn" title="Split Horizontal (Cmd+D)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="12" y1="3" x2="12" y2="21"></line>
          </svg>
        </button>
        <button id="split-v-btn" title="Split Vertical (Cmd+Shift+D)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="3" y1="12" x2="21" y2="12"></line>
          </svg>
        </button>
        <button id="search-btn" title="Search (Cmd+F)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search bar -->
    <div id="search-bar" class="hidden">
      <input type="text" id="search-input" placeholder="Search terminal output..." />
      <button id="search-prev">&uarr;</button>
      <button id="search-next">&darr;</button>
      <button id="search-close">&times;</button>
    </div>

    <!-- Terminal area -->
    <div id="terminal-container"></div>

    <!-- Empty state -->
    <div id="empty-state">
      <div class="empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <h2>Welcome to TerminalHub</h2>
      <p>All your terminals, one place.</p>
      <button id="empty-new-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Open a Terminal
      </button>
    </div>
  </main>

  <script src="bundle.js"></script>
</body>
</html>
