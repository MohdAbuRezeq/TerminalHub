<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Strict CSP: no inline scripts, no remote loads. The process.env shim
       lives at the top of renderer.js so we don't need 'unsafe-inline' here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none';">
  <title>TerminalHub</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <div id="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span>TerminalHub</span>
      </div>
      <button id="sidebar-toggle" title="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>

    <div id="new-terminal-group">
      <button id="new-terminal-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>New Terminal</span>
      </button>
      <button id="new-terminal-folder-btn" title="Open in folder (Cmd+M)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
    </div>

    <div id="terminal-list"></div>

    <div id="sidebar-footer">
      <div id="terminal-stats">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span id="stats-text">0 terminals</span>
      </div>
      <div id="shortcuts-hint">
        <kbd>&#8984;N</kbd> new &middot; <kbd>&#8984;M</kbd> new in folder &middot; <kbd>&#8984;W</kbd> close
        <br />
        <kbd>&#8984;D</kbd> split &middot; <kbd>&#8984;R</kbd> rename &middot; <kbd>&#8984;F</kbd> find
        <br />
        <kbd>&#8984;&#8593;&#8595;</kbd> tabs &middot; <kbd>&#8984;&#8592;&#8594;</kbd> panes
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main id="main">
    <!-- Drag region for window -->
    <div id="main-titlebar">
      <button id="sidebar-expand" title="Show sidebar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
      <div id="main-title"></div>
      <div id="main-actions">
        <button id="split-h-btn" title="Split Horizontal (Cmd+D)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="12" y1="3" x2="12" y2="21"></line>
          </svg>
        </button>
        <button id="split-v-btn" title="Split Vertical (Cmd+Shift+D)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="3" y1="12" x2="21" y2="12"></line>
          </svg>
        </button>
        <button id="snippets-btn" title="Snippets (Cmd+Shift+S)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </button>
        <button id="search-btn" title="Search (Cmd+F)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search bar -->
    <div id="search-bar" class="hidden">
      <input type="text" id="search-input" placeholder="Search terminal output..." />
      <button id="search-prev">&uarr;</button>
      <button id="search-next">&darr;</button>
      <button id="search-close">&times;</button>
    </div>

    <!-- Snippets palette -->
    <div id="snippets-overlay" class="hidden">
      <div id="snippets-palette">
        <div id="snippets-header">
          <span>Snippets</span>
          <button id="snippets-add-btn" title="Add snippet">+</button>
        </div>
        <div id="snippets-list"></div>
        <div id="snippets-empty">No snippets yet. Click + to add one.</div>
        <div id="snippet-form" class="hidden">
          <input type="text" id="snippet-name" placeholder="Name (e.g. Claude)" />
          <input type="text" id="snippet-command" placeholder="Command (e.g. claude --dangerously-skip-permissions)" />
          <div id="snippet-form-actions">
            <button id="snippet-cancel">Cancel</button>
            <button id="snippet-save">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- New terminal picker (Blank + snippets) -->
    <div id="new-terminal-picker-overlay" class="hidden">
      <div id="new-terminal-picker">
        <div id="new-terminal-picker-header">
          <span>New terminal</span>
        </div>
        <div id="new-terminal-picker-list"></div>
      </div>
    </div>

    <!-- Close confirmation dialog -->
    <div id="confirm-overlay" class="hidden">
      <div id="confirm-dialog">
        <p id="confirm-message">Close this terminal?</p>
        <div id="confirm-actions">
          <button id="confirm-cancel">Cancel</button>
          <button id="confirm-ok">Close</button>
        </div>
      </div>
    </div>

    <!-- Terminal area -->
    <div id="terminal-container"></div>

    <!-- Empty state -->
    <div id="empty-state">
      <div class="empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <h2>Welcome to TerminalHub</h2>
      <p>All your terminals, one place.</p>
      <button id="empty-new-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Open a Terminal
      </button>
    </div>
  </main>

  <script src="bundle.js"></script>
</body>
</html>
